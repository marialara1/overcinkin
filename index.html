<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main>
        <ul class="gallery">
            <li><img src="/img/IMG_3266.PNG" alt=""></li>
            <li><img src="/img/IMG_3267.PNG" alt=""></li>
            <li><img src="/img/IMG_3268.PNG" alt=""></li>
            <li><img src="/img/IMG_3269.PNG" alt=""></li>
            <li><img src="/img/IMG_3270.PNG" alt=""></li>
            <li><img src="/img/IMG_3271.PNG" alt=""></li>
        </ul>
    </main>
    <script>
let lastStarTime = 0;

window.addEventListener('scroll', () => {
    const now = Date.now();

    // limita cuántas estrellas salen para no montar una rave
    if (now - lastStarTime < 80) return;
    lastStarTime = now;

    const star = document.createElement('div');
    star.textContent = '★';
    star.classList.add('scroll-star');

    const size = Math.random() * 24 + 6; // entre 6px y 30px
    const x = Math.random() * window.innerWidth;
    const y = Math.random() * window.innerHeight;
    const rotation = Math.random() * 360;

    star.style.left = `${x}px`;
    star.style.top = `${y}px`;
    star.style.fontSize = `${size}px`;
    star.style.transform = `rotate(${rotation}deg)`;

    document.body.appendChild(star);

    setTimeout(() => {
        star.remove();
    }, 900);
});
</script>
</body>
</html>
